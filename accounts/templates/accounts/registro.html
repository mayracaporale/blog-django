
{% extends 'posts/base.html' %}

{% block titulo %}Registrarse{% endblock %}

{% block content %}
<h2>Crear una cuenta</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">Registrarme</button>
</form>

<p>¿Ya tenés una cuenta?
    <a href="{% url 'login' %}">Iniciá sesión</a>
</p>
{% endblock %}
