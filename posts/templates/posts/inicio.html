<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi blog</title>
</head>
<body>
    <h1>Mi blog</h1>
    {% for publicacion in publicaciones %}
        <article>
            <h2>{{ publicacion.titulo }}</h2>
            <p>{{ publicacion.contenido }}</p>
            <p>Autor: {{ publicacion.autor }}</p>
            <p>Fecha: {{ publicacion.fecha_creacion }}</p>
        </article>
    {% empty %}
        <p>Todavía no hay publicaciones.</p>
    {% endfor %}
</body>
</html>
