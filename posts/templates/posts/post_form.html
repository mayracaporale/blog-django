{% extends "posts/base.html" %}

{% block content %}

<div class="contenedor-post">

    <h1>Crear o editar publicación</h1>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        {{ formulario.as_p }}

        <button type="submit">Guardar publicación</button>

    </form>

    <a href="{% url 'lista_posts' %}">Volver al listado</a>

</div>

{% endblock %}
