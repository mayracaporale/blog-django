{% extends "posts/base.html" %}

{% block content %}

<div class="contenedor-post">

    <h1>{{ post.titulo }}</h1>

    <p>Autor: {{ post.autor }}</p>

    <p>Estado: {{ post.estado }}</p>

    {% if post.imagen %}
        <img src="{{ post.imagen.url }}"
             alt="{{ post.titulo }}"
             style="max-width: 100%; height: auto;">
    {% endif %}

    <div>
        {{ post.contenido|linebreaks }}
    </div>

    <a href="{% url 'editar_post' post.pk %}">Editar publicación</a>

    <a href="{% url 'eliminar_post' post.pk %}">Eliminar publicación</a>

    <a href="{% url 'lista_posts' %}">Volver al listado</a>

</div>

{% endblock %}
