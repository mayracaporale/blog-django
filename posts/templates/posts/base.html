
{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Mi blog{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'posts/css/estilos.css' %}">
</head>
<body>
    <header>
        <h1>Mi blog</h1>

        <nav>
            <a href="{% url 'inicio' %}">Inicio</a>
            <a href="{% url 'acerca' %}">Acerca de</a>

            {% if user.is_authenticated %}
                <span>Hola, {{ user.username }}</span>
                <a href="{% url 'mi_perfil' %}">Mi perfil</a>
                <a href="{% url 'crear_post' %}">Crear post</a>

                <form method="post" action="{% url 'logout' %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit">Cerrar sesión</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Iniciar sesión</a>
                <a href="{% url 'registro' %}">Registrarse</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>Mi blog - Proyecto Django</p>
    </footer>
</body>
</html>
